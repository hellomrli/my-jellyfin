name: build-windows

on:
  workflow_call:
    inputs:
      qt_version:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      qt_version:
        description: "Qt version override (empty uses dev/qt-version.txt)"
        type: string
        default: ""
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/windows-package.yml
    with:
      qt_version: ${{ inputs.qt_version || '' }}
